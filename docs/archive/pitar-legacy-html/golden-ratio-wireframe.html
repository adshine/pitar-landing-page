<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Ratio — Four Grid Wireframe</title>
    <style>
      :root {
        --paper: #f3f0e8;
        --ink: #171714;
        --muted: #716e65;
        --line: #171714;
        --accent: #d74b2a;
        --minor: 38.1966%;
        --major: 61.8034%;
        --left-column: 65%;
        --right-column: 35%;
        --top-row: 70%;
        --bottom-row: 30%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(23, 23, 20, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 23, 20, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
        font-family: "Courier New", Courier, monospace;
      }

      main {
        width: 100vw;
        height: 100svh;
        padding: 24px;
      }

      .frame {
        position: relative;
        display: grid;
        grid-template-columns: var(--left-column) var(--right-column);
        grid-template-rows: var(--top-row) var(--bottom-row);
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 2px solid var(--line);
        background: rgba(243, 240, 232, 0.82);
      }

      .cell {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: clamp(18px, 2vw, 34px);
      }

      .cell:nth-of-type(odd) {
        border-right: 2px solid var(--line);
      }

      .cell:nth-of-type(-n + 2) {
        border-bottom: 1px solid var(--line);
      }

      .cell::after {
        position: absolute;
        right: 14px;
        bottom: 10px;
        color: rgba(23, 23, 20, 0.18);
        content: attr(data-index);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 8vw, 8rem);
        line-height: 0.8;
      }

      .cell::after,
      .cell-label,
      .cell-ratio,
      .axis-label {
        display: none;
      }

      .cell-label {
        position: relative;
        z-index: 1;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .cell-ratio {
        position: relative;
        z-index: 1;
        color: var(--accent);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-align: right;
        text-transform: uppercase;
      }

      .wireframe-hero-title {
        position: absolute;
        z-index: 2;
        left: clamp(18px, 2vw, 34px);
        bottom: clamp(24px, 5vh, 64px);
        max-width: calc(100% - clamp(36px, 4vw, 68px));
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.65rem, 4.15vw, 5.25rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.9;
      }

      .wireframe-hero-title span {
        display: block;
        white-space: nowrap;
      }

      .wireframe-subtitle {
        position: absolute;
        z-index: 2;
        right: clamp(18px, 2vw, 34px);
        bottom: clamp(24px, 5vh, 64px);
        left: clamp(18px, 2vw, 34px);
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1rem, 1.45vw, 1.45rem);
        line-height: 1.45;
      }

      .axis-label {
        position: absolute;
        z-index: 3;
        padding: 5px 7px;
        border: 1px solid var(--ink);
        background: var(--paper);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .axis-label.vertical {
        top: 14px;
        left: var(--left-column);
        transform: translateX(-50%);
      }

      .axis-label.horizontal {
        top: var(--top-row);
        right: 14px;
        transform: translateY(-50%);
      }

      @media (max-width: 700px) {
        main {
          padding: 12px;
        }

        .cell {
          padding: 14px;
        }

        .cell-ratio,
        .axis-label.horizontal {
          display: none;
        }

      }
    </style>
  </head>
  <body>
    <main>
      <section class="frame" aria-label="Four-cell golden ratio wireframe">
        <div class="axis-label vertical">65% / 35%</div>
        <div class="axis-label horizontal">70% / 30%</div>

        <article class="cell" data-index="01">
          <span class="cell-label">Top left</span>
          <span class="cell-ratio">65w × 70h</span>
          <h1 class="wireframe-hero-title">
            <span>Get answers you can trust</span>
            <span>from every file you own.</span>
          </h1>
        </article>
        <article class="cell" data-index="02">
          <span class="cell-label">Top right</span>
          <span class="cell-ratio">35w × 70h</span>
          <p class="wireframe-subtitle">
            Search emails, contracts, scans, and cloud drives in one place. Get a concise answer, then open the exact page it came from.
          </p>
        </article>
        <article class="cell" data-index="03">
          <span class="cell-label">Bottom left</span>
          <span class="cell-ratio">65w × 30h</span>
        </article>
        <article class="cell" data-index="04">
          <span class="cell-label">Bottom right</span>
          <span class="cell-ratio">35w × 30h</span>
        </article>
      </section>
    </main>
  </body>
</html>
